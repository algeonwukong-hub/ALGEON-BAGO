
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
<script src="TUESDAY ACT.js"></script>
    <link rel="stylesheet" href="TUESDAY ACT.css">
</head>
<body>

    <div class="page-wrapper">
        <div class="contact-container">

            <div class="contact-header">
                <h1>Contact Us</h1>
                <p>Have a question or concern? Send us a message.</p>
            </div>

            <form action="submit.php" method="POST" id="contactForm">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input
                        type="text"
                        id="address"
                        name="address"
                        placeholder="Enter your address"
                        required>
                </div>

                <div class="form-group">
                    <label for="contact">Contact Number</label>
                    <input
                        type="tel"
                        id="contact"
                        name="contact"
                        inputmode="numeric"
                        pattern="[0-9]{7,15}"
                        maxlength="15"
                        placeholder="Enter 7 to 15 digits"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Write your message here..."
                        required></textarea>
                </div>

                <p id="notice" aria-live="polite"></p>

                <button type="submit">Send Message</button>

            </form>

        </div>
    </div>

</body>
</html>
