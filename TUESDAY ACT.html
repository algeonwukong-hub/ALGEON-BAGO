<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="TUESDAY ACT.css">
    <script src="TUESDAY ACT.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Contact Us</h1>
        <p>Fill out the form below to send us a message.</p>

        <form action="submit.php" method="POST" id="contactForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="address">Address</label>
            <input type="text" id="address" name="address" required>

            <label for="contact">Contact Number</label>
            <input type="tel" id="contact" name="contact"
                   inputmode="numeric" pattern="[0-9]{7,15}"
                   maxlength="15" placeholder="Numbers only"
                   title="Enter 7 to 15 digits" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Your Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Submit Message</button>
            <p id="notice"></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
